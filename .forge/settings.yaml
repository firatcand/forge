version: 1
project:
  name: forge
  description: Lightweight framework for agentic development — wraps Claude Code (or Codex / Cursor / Gemini) with structured discovery, decomposition, and Symphony-style parallel agent orchestration.
tracker:
  type: linear
  config:
    team_id: bf9e034a-51fc-4147-99ea-692947dcc1bb
secrets:
  manager: env_file
  env_file_path: ./.env.local
agents:
  max_concurrent: 10
  retry_attempts: 10
  retry_backoff_ms_max: 300000
  poll_interval_ms: 30000
  worktree_root: ./.forge/worktrees
  on_persistent_failure: notify
  primary_host_cli: claude
  review_host_cli: codex
  enabled_root_files:
    - claude
    - codex
design:
  mode: project_owned
# FORGE-181 (/audit dogfood): the full gate. Makes forge "just another adopter"
# — /audit reads settings.verify to know findings are verifiable, and /qa,
# /drive, /deliver run this gate. The audit feature carries none of these
# commands in code; they live HERE, in forge's own config.
verify:
  commands:
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
methodology_version: 0.4.4
