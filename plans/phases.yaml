        description: "Forge today has two worktree-location conventions: `/pickup-task` skill uses `../${PROJECT}-worktrees/${TICKET}/` (sibling, outside repo) while the orchestrator uses `.forge/worktrees/<sanitized-id>/` (inside repo). The split is accidental — `/pickup-task` predates the orchestrator design. Standardize on `.forge/worktrees/<sanitized-id>/` for consistency with the orchestrator, self-containment (rm project → cleanup), project-relative paths, and the already-pressure-tested orchestrator design (`.forge/` is already gitignored; the worktree checkout contains only tracked files so no recursion). Update `/pickup-task` SKILL.md to create at `.forge/worktrees/<id>/` using the same `sanitizeIssueId` rules as `src/core/workspace.ts`. Extend `forge init` to scaffold tooling-exclude entries (`.eslintignore`, `.prettierignore`, tsconfig `exclude`, vitest `exclude`) so `.forge/worktrees/**` doesn't get double-processed by detected tools (detect-and-skip — no-op if tool absent). Document the convention in `spec/SPEC.md` §Module layout as the single canonical location. CHANGELOG: behavior-change note for v0.3.x adopters (existing sibling worktrees can be `git worktree move`d or removed)."
