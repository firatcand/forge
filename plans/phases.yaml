      - id: P2.5-T20
        tracker_issue_id: "FORGE-116"
        title: "/wrap-up skill — end-of-task housekeeping (merged PR → prune worktree, branch, ff main, reconcile)"
        description: "After a PR merges, forge has no end-to-end housekeeping flow — the user manually verifies merge, removes worktree, deletes branch, fast-forwards main, and hopes /reconcile catches the state update. The engines exist (`forge orchestrate gc`, `/reconcile`) but no thin user-facing skill composes them. Add `/wrap-up` skill (Option A from the trade-off matrix: skill = UX + confirmation; verbs = engine). Flow: (1) detect task scope from current worktree branch, or list shipped-but-not-cleaned tasks if invoked from main; (2) verify PR merged via `gh pr view --json state,mergedAt`, abort if not; (3) run `forge orchestrate reconcile --pull` to sync tracker → phases.yaml; (4) show preview of cleanup plan (worktree, branch, main delta); (5) on user confirmation: `forge orchestrate gc --remove-worktree --task <id>` + `git branch -d <branch>` + `git switch main && git pull --ff-only` (refuse if local main is dirty); (6) report one-line summary. `/wrap-up --all` mode batches all shipped-but-not-cleaned tasks with a single confirmation. Suggest-don't-force throughout: always asks before mutating."
        type: integration
        priority: P1
        depends_on: [P2.5-T09, P2-T09]
