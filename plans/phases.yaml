phases:
  - id: phase-2.5
    name: Closed-loop workflow control
    status: active
    goal: Spec-change propagation, roadmap amendment, and tracker-mutation hardening so the closed-loop workflow is safe and self-correcting.
    gate_criteria:
      - All P0 tasks (/update-spec, /amend-roadmap) shipped with tests
      - npm run typecheck && npm run test && npm run build green
    tasks:
      - id: P2.5-T01
        tracker_issue_id: FORGE-93
        title: "[P2.5-T02] /update-spec --draft and /update-spec --apply skill (two modes)"
        description: "Single skill, two modes. --draft scaffolds spec/decisions/<date>-<slug>.md from template (refuses if a draft exists). --apply <slug> requires frontmatter status: accepted, shows per-artifact diff (SPEC+PRD+phases+tracker), writes a journal, deletes the ADR on success and uses its content as the commit body; --resume/--yes-all supported. Delegates atomic mutations to the apply-decision verb."
        type: skill
        priority: P0
        depends_on: []
        estimate: L
        owner_type: backend-dev
        acceptance:
          - --draft writes a valid ADR from template and refuses when another draft exists
          - "--apply <slug> refuses unless status: accepted; shows per-artifact diff with confirm or --yes-all"
          - On success ADR deleted, rationale becomes commit body; --resume continues from journal
      - id: P2.5-T02
        tracker_issue_id: FORGE-101
        title: "[P2.5-T10] /amend-roadmap skill + forge orchestrate amend-roadmap verb"
        description: "skills/amend-roadmap + src/cli/orchestrate/amend-roadmap.ts for mid-flight task creation: prompt for title/description/type/ACs/depends_on/owner_type, write phases.yaml and push to tracker atomically (rollback both on failure), resumable journal under .forge/orchestrator/global/amend-journal/<task-id>.json, auto-invoke worktree-drift-guard after success."
        type: skill
        priority: P0
        depends_on: []
        estimate: M
        owner_type: backend-dev
        acceptance:
          - Writes phases.yaml + tracker atomically (rollback both if either fails)
          - New task gets next P<phase>-T<n> id; resumable journal written
          - Invokes worktree-drift-guard --dry-run preview after success
      - id: P2.5-T03
        tracker_issue_id: FORGE-116
        title: "[P2.5-T20] /wrap-up skill — end-of-task housekeeping (merged PR → prune worktree, branch, ff main, reconcile)"
        description: "New skills/wrap-up composing existing engines into post-merge cleanup: detect task scope from worktree branch, verify PR merged via gh, run reconcile --pull, show a cleanup preview, then on approval prune the worktree via gc, delete the branch and fast-forward main. Suggest-don't-force; --all batch mode."
        type: skill
        priority: P1
        depends_on: []
        estimate: S
        owner_type: backend-dev
        acceptance:
          - Auto-detects task ID from worktree branch; aborts (deletes nothing) if PR not merged
          - Runs reconcile --pull, shows preview, confirms before any destructive action
          - On approval removes worktree via gc, deletes branch, fast-forwards main
      - id: P2.5-T04
        tracker_issue_id: FORGE-118
        title: "Tracker adapters: harden body-mutation methods (retry, dedup, fenced-code-blocks, CAS)"
        description: "Codex/review follow-ups deferred from the updateIssueBody work: wrap updateIssueBody/setBlockedBy in withRetry on Linear+GitHub; dedup parseExtraForgeFooters by KEY; stop matching forge comments inside fenced code blocks; decide CAS/single-writer contract; verify or remove the Linear description byte cap."
        type: backend
        priority: P2
        depends_on: []
        estimate: M
        owner_type: backend-dev
        acceptance:
          - updateIssueBody + setBlockedBy wrapped in withRetry with retry-on-RATE_LIMITED tests per adapter
          - parseExtraForgeFooters dedups by KEY; fenced-code forge comments round-trip without re-emission
          - CAS/single-writer contract decided and documented
      - id: P2.5-T05
        tracker_issue_id: FORGE-119
        title: "[follow-up] /reconcile --task &lt;id&gt; filter (deferred from FORGE-100)"
        description: "Add --task <id> to parseReconcileArgv: filter diffPull/diffPush to the matching task (by id or tracker_issue_id), error INVALID_ARGS on unknown id, surface the scope in dry-run. Thin filter layer over the working diff functions."
