      # ===================================================================
      # ORCHESTRATOR SUBSYSTEM — v2 RE-DECOMPOSITION (2026-05-14)
      # ===================================================================
      # The architecture in spec/ORCHESTRATOR.md was rewritten 2026-05-14 to
      # delete the long-running daemon design and adopt a CLI-as-control-plane
      # + skill-as-dispatch model. Workers are host-native subagents (Claude
      # Task tool / Codex native subagents), NOT execa-spawned host CLIs.
      # Workers bill against the user's interactive subscription, never Agent
      # SDK quota or API credits.
      #
      # This re-decomposition:
      #   1. Adds refactor follow-ups (P2-T13/T14/T15/T16 = FORGE-72/76/77/73)
      #      bringing merged v1 work (Tracker interface, LinearTracker,
      #      GitHubTracker, Question channel) to v2 contracts.
      #   2. Adds a new foundational task (P2-T17 / FORGE-78) for the state
      #      machine + lease infrastructure that the rest of the orchestrator
      #      sits on top of.
      #   3. RESCOPES P2-T07/T08/T09/T12 (FORGE-20/21/22/65):
      #        - FORGE-20 → CLI verb suite (`forge orchestrate <verb>`)
      #        - FORGE-21 → worker prompt template (templates/worker-prompt.md)
      #        - FORGE-22 → gc reconciliation + retry policy (no signals)
      #        - FORGE-65 → decision classifier + preflight + decision_key dedupe
      #   4. Adds a new task (P2-T18 / FORGE-74) for the dispatch skill
      #      `/forge orchestrate` that runs in the user's main session and
      #      calls the CLI in a loop.
      #   5. Adds a new task (P2-T19 / FORGE-79) for file-glob overlap
      #      detection at dispatch time.
      #
      # Dispatch ordering (updated 2026-05-16 — adds P2-T20/T21/T22 for
      # multi-harness peers + /second-opinion rename + /status-check dashboard):
      #
      #   P2-T11 (DONE, FORGE-64) →
      #   {P2-T13 (FORGE-72), P2-T16 (FORGE-73)} parallel →
      #   P2-T17 (FORGE-78) →
      #   P2-T19 (FORGE-79) →
      #   P2-T07 (FORGE-20) [consumes FORGE-79] [unlocks P2-T22 in parallel] →
      #   P2-T08 (FORGE-21) →
      #   P2-T20 (FORGE-88) [unlocks P2-T21 in parallel] →
      #   P2-T12 (FORGE-65) → P2-T18 (FORGE-74) → P2-T09 (FORGE-22)
      #
      # P2-T14 (FORGE-76) and P2-T15 (FORGE-77) unblock as soon as P2-T13
      # lands (their depends_on=[P2-T13] only); they can run in parallel
      # anywhere in the chain after T13 — no need to wait for T07.
      # P2-T21 (FORGE-89, /second-opinion rename) unblocks as soon as
      # P2-T20 lands. P2-T22 (FORGE-90, /status-check dashboard) unblocks
      # as soon as P2-T07 lands.
      #
      # (Phase 3 add: P3-T08 / FORGE-75 — skill portability across hosts.)
      # ===================================================================
