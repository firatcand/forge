        tracker_issue_id: FORGE-184
        title: "[Autopilot I1.1] State-machine: park architectural escalations from ready_for_review"
        description: An architectural escalation raised while a task is ready_for_review writes the question but never parks the task, so the auto-review loop re-escalates forever. Add the ready_for_review:question_written -> blocked_on_question transition and broaden the post-write guard to cover ready_for_review.
