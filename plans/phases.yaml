        description: Pure module combining the primary-host review and optional Codex second opinion into one complete-verb Verdict, bridging ReviewVerdict {pass|changes_requested} and worker Verdict {ready_for_review|changes_needed|blocked}. Encodes pass/changes/architectural policy with no I/O.
