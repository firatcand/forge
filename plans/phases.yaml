        priority: P2
        depends_on: []
        estimate: M
        owner_type: backend-dev
        acceptance:
          - composeReviewVerdict(primary, secondOpinion|null, ctx) is pure (no I/O)
          - "Policy: both pass -> ready_for_review; mechanical -> changes_needed; architectural -> escalate; missing 2nd opinion on CRITICAL -> park"
