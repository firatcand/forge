  - id: phase-4
    name: v0.5.0 — Autopilot, /audit, Loom, Tripwire
    status: active
    goal: Autonomous plan-gated review->ship pipeline, read-only /audit, plan-mode inbox, graph memory (Loom), and prompt-injection defense (Tripwire).
