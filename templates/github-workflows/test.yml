name: Tests
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      # Optional: --if-present makes this a no-op (exit 0) when the project
      # defines no `lint` script, so the workflow doesn't fail for adopters
      # who haven't set up a linter.
      - run: npm run lint --if-present
      - run: npm test
