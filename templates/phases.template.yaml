project: "{{PROJECT_NAME}}"
# Default gate. typecheck is the hard requirement; e2e and lint use
# --if-present so a project that hasn't defined those scripts isn't blocked.
# Edit this to match your project's actual verification commands.
gate_check_command: "npm run e2e --if-present && npm run typecheck && npm run lint --if-present"

# Source provenance: written by /reconcile --pull on every regeneration.
# /push-to-tracker bootstraps source.project_id on first sync; do not
# hand-edit. Absence prints "no source metadata" on every read.
# FORGE-127: tracker_url now lives INSIDE this block (was a top-level key).
# source:
#   tracker: linear|github|notion
#   project_id: ""           # populated by /push-to-tracker
#   synced_at: "<ISO-8601>"
#   spec_revision: "<sha>"
#   tracker_url: ""          # populated by /push-to-tracker (was top-level)
#   tracker_revision: ""     # FORGE-123: opaque upstream-equality token

phases:
  - id: phase-1
    name: "Foundations"
    status: active
    goal: "Working skeleton end-to-end with seed data"
    gate_criteria:
      - "All P0 + P1 tasks closed in the tracker"
      - "Dev deploy succeeds"
      - "No P0 bugs open"
    tasks:
      - id: P1-T01
        tracker_issue_id: ""  # populated by /push-to-tracker
        title: ""
        description: ""
        type: foundation
        priority: P0
        depends_on: []
        estimate: M
        owner_type: backend-dev
        # model_tier: small|standard|frontier  # optional (capability floor; orchestrator escalates up only)
        acceptance:
          - ""

  - id: phase-2
    name: "Core Features"
    status: blocked
    blocked_by: phase-1
    goal: ""
    gate_criteria:
      - ""
    tasks: []

  - id: phase-3
    name: "Polish & Launch"
    status: blocked
    blocked_by: phase-2
    goal: ""
    gate_criteria:
      - ""
    tasks: []
