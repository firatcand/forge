name: GitHub Release

# FORGE-157 — fires on the same `v*` tag push as `release.yml` and PUBLISHES a
# GitHub Release pre-filled with the matching CHANGELOG section, marked Latest.
# Runs alongside the npm publish workflow so every npm release has a matching,
# published GH Release (no manual draft-publishing step).
#
# Security: GITHUB_REF_NAME is consumed via env var (safe).

on:
  push:
    tags:
      - 'v*'
  # FORGE: also callable from auto-tag.yml (same rationale as release.yml — a
  # default-token tag push doesn't re-trigger the `push: tags` path).
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.4.5 (defaults to the pushed ref).'
        required: false
        type: string

permissions:
  contents: write    # required to create the GitHub Release

jobs:
  publish-release:
    name: Publish release from CHANGELOG
    runs-on: ubuntu-latest
    env:
      # Resolve to the workflow_call input when present, else the pushed ref.
      # Consumed via env per workflow-injection guidance.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract CHANGELOG section for this tag
        id: changelog
        run: |
          TAG="${RELEASE_TAG#v}"
          # Slice CHANGELOG.md from `## [TAG]` to the next `## [` line
          # (exclusive). awk flag-based slicing handles trailing blank
          # lines correctly without sed's escape ceremony.
          NOTES="$(awk -v tag="$TAG" '
            BEGIN { flag=0 }
            /^## \[/ && flag==1 { exit }
            $0 ~ ("^## \\[" tag "\\]") { flag=1; next }
            flag==1 { print }
          ' CHANGELOG.md)"
          # Trim trailing blank lines.
          NOTES="$(printf '%s' "$NOTES" | sed -e ':a' -e '/^$/{$d;N;ba' -e '}')"
          if [ -z "$NOTES" ]; then
            NOTES="Release notes not found in CHANGELOG.md for version ${TAG}."
          fi
          {
            echo 'notes<<__EOF__'
            echo "$NOTES"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          make_latest: true
