name: Draft GitHub Release

# FORGE-157 — fires on the same `v*` tag push as `release.yml` and creates
# a DRAFT GitHub Release pre-filled with the matching CHANGELOG section.
# Independent of the npm publish workflow: tag push immediately publishes
# to npm, and ALSO drafts a GH Release the user can review + publish from
# the GH UI when ready. Decoupling lets release-notes editing happen
# without blocking the npm publish.
#
# Security: GITHUB_REF_NAME is consumed via env var (safe).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # required to create the GitHub Release

jobs:
  draft-release:
    name: Draft release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract CHANGELOG section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Slice CHANGELOG.md from `## [TAG]` to the next `## [` line
          # (exclusive). awk flag-based slicing handles trailing blank
          # lines correctly without sed's escape ceremony.
          NOTES="$(awk -v tag="$TAG" '
            BEGIN { flag=0 }
            /^## \[/ && flag==1 { exit }
            $0 ~ ("^## \\[" tag "\\]") { flag=1; next }
            flag==1 { print }
          ' CHANGELOG.md)"
          # Trim trailing blank lines.
          NOTES="$(printf '%s' "$NOTES" | sed -e ':a' -e '/^$/{$d;N;ba' -e '}')"
          if [ -z "$NOTES" ]; then
            NOTES="Release notes not found in CHANGELOG.md for version ${TAG}. Edit this draft before publishing."
          fi
          {
            echo 'notes<<__EOF__'
            echo "$NOTES"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
          prerelease: false
