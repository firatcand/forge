name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs to avoid runner pile-up; preserve every run on
# main so the merge history is fully recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: build
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      # We DO need checkout + npm ci (prod-only) here: tsdown deliberately
      # marks `dependencies` as external (the correct shape for an npm
      # package), so the CJS bundle resolves chalk/zod/etc. from
      # node_modules at runtime. End users get those deps installed by npm
      # when they run `npm install @firatcand/forge`; the smoke job
      # mirrors that — install prod deps only, then exercise the bundled
      # entrypoint exactly as a user would.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist
      # --version exits before any chalk/help-text rendering; --help
      # exercises the full command-registration path including coloured
      # output. Both together cover the chalk-v5 / top-level-await /
      # dual-format bug classes documented in
      # docs/learnings/2026-Q2/ship-gates-missed-build-step.md.
      - run: node dist/bin/forge.cjs --version
      - run: node dist/bin/forge.cjs --help

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 lets gitleaks-action compare against the PR base
          # for diff mode. On push events the action falls back to a full
          # history scan automatically.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
